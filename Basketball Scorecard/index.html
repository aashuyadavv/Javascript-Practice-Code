<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball ScoreCard</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div>
            <h3>HOME</h3>
            <h1 id="home-score">0</h1>
            <button id="home-plus-one">+1</button>
            <button id="home-plus-two">+2</button>
            <button id="home-plus-three">+3</button>
        </div>
        <div>
            <h3>GUEST</h3>
            <h1 id="guest-score">0</h1>
            <button id="guest-plus-one">+1</button>
            <button id="guest-plus-two">+2</button>
            <button id="guest-plus-three">+3</button>
        </div>
    </div>
    <script src="index.js"></script>    
</body>
</html>
